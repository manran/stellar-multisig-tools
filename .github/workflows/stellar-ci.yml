name: Stellar CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.api.json'
      - 'tsconfig.stellar.json'
      - '.github/workflows/stellar-ci.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
