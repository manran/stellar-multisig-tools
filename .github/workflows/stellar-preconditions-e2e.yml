name: Stellar Preconditions Live E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/livePreconditionsE2e.ts'
      - '.github/workflows/stellar-preconditions-e2e.yml'

permissions:
  contents: read

jobs:
  testnet-preconditions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/livePreconditionsE2e.ts
